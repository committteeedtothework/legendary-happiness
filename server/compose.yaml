services:
  relay:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      PUBLIC_URL: https://${DCSMCRAFT_DOMAIN:?Set DCSMCRAFT_DOMAIN to your public DNS name}
    expose:
      - "8787"
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    environment:
      DCSMCRAFT_DOMAIN: ${DCSMCRAFT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
