# Optional Render Blueprint. Deployment needs the owner's Render account.
services:
  - type: web
    name: dcsmcraft-relay
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        sync: false
